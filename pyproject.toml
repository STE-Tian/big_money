[project]
name = "personal-quant-ai"
version = "1.0.0"
description = "Personal quant research, historical backtest, paper-trading, and AI research workbench. Not a live trading bot."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "duckdb>=1.1.0",
  "pyarrow>=16.0.0",
  "plotly>=5.22.0",
  "streamlit>=1.40.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "matplotlib>=3.9.0",
  "langgraph>=0.2.40",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: calls Binance public market-data endpoints; skipped when the network or API is unreachable",
]
